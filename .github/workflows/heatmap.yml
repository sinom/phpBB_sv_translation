name: Generate Commit Heatmap

on:
  push:
    branches:
      - main
      - master

  schedule:
    - cron: "0 3 * * 0"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  heatmap:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      - name: Generate heatmap
        run: |
          python3 scripts/generate_heatmap.py


      - name: Commit updated heatmap

        run: |

          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add images/commit-heatmap.svg


          git commit \
            -m "Update commit heatmap" \
            || exit 0


          git push
